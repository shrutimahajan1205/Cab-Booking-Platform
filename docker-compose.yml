version: "3.8"

services:
  # 1. PostgreSQL with PostGIS extension for Geospatial queries
  db:
    image: postgis/postgis:16-3.4
    container_name: cab_postgres
    restart: always
    environment:
      POSTGRES_USER: cab_user
      POSTGRES_PASSWORD: cab_password
      POSTGRES_DB: cab_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cab_user -d cab_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis for caching, presence, and real-time Pub/Sub message broker
  redis:
    image: redis:7-alpine
    container_name: cab_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cab_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://cab_user:cab_password@db:5432/cab_booking
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-cab-booking-2026-production-ready
      - STRIPE_SECRET_KEY=sk_test_mock_secret_key_cab_booking
      - STRIPE_PUBLISHABLE_KEY=pk_test_mock_publishable_key
      - STRIPE_WEBHOOK_SECRET=whsec_mock_webhook_secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Background Worker for async jobs & receipt generation
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cab_celery_worker
    restart: always
    command: celery -A app.tasks.celery_tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://cab_user:cab_password@db:5432/cab_booking
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

  # 5. Next.js + React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cab_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
